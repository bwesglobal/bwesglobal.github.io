<svg width="100%" viewBox="0 0 1000 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>General-purpose and maritime agent harnesses</title>
  <desc>The same frontier model capability can operate inside different harnesses. A general-purpose harness offers configurable context, tools and outputs across many tasks. AanyaX provides a maritime environment with BOSS context, approved capabilities, scheduled fleet execution and operational outputs built in.</desc>
  <defs>
    <linearGradient id="diagram-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFDFF"/>
      <stop offset="100%" stop-color="#F3F8FD"/>
    </linearGradient>
    <linearGradient id="model-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAF2FD"/>
      <stop offset="50%" stop-color="#F2F0FF"/>
      <stop offset="100%" stop-color="#E6F6F3"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#87A6C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#69BEB3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="996" height="616" rx="24" fill="url(#diagram-bg)" stroke="#DFE9F4" stroke-width="1.5"/>

  <rect x="235" y="28" width="530" height="88" rx="18" fill="url(#model-bg)" stroke="#C9D8E8" stroke-width="1.3"/>
  <circle cx="285" cy="72" r="24" fill="#FFFFFF" stroke="#B9CDE2" stroke-width="1.2"/>
  <path d="M274 72 C274 64 280 59 287 59 C295 59 300 65 300 72 C300 78 296 81 293 84 L293 89 L279 89 L279 84 C276 81 274 78 274 72Z" fill="none" stroke="#496E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M281 94 H291" stroke="#496E98" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="282" cy="71" r="1.7" fill="#15B8A6"/>
  <circle cx="292" cy="71" r="1.7" fill="#2E7CE4"/>
  <text x="325" y="65" font-family="sans-serif" font-size="22" font-weight="600" fill="#0E2A47">Frontier model reasoning</text>
  <text x="325" y="91" font-family="sans-serif" font-size="14" fill="#58738F">Understand instructions &#183; plan work &#183; choose tools &#183; synthesize results</text>

  <path d="M430 116 C430 136 305 132 265 154" fill="none" stroke="#87A6C8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M570 116 C570 136 695 132 735 154" fill="none" stroke="#69BEB3" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

  <rect x="38" y="160" width="444" height="422" rx="18" fill="#FFFFFF" stroke="#C9D8E8" stroke-width="1.4"/>
  <rect x="518" y="160" width="444" height="422" rx="18" fill="#FFFFFF" stroke="#A9DCD5" stroke-width="1.4"/>

  <rect x="38" y="160" width="444" height="58" rx="18" fill="#EEF4FB"/>
  <path d="M38 200 H482 V218 H38Z" fill="#EEF4FB"/>
  <circle cx="73" cy="189" r="15" fill="#FFFFFF" stroke="#AFC5DD" stroke-width="1.2"/>
  <path d="M65 184 H81 M65 189 H77 M65 194 H80" stroke="#496E98" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="186" font-family="sans-serif" font-size="18" font-weight="600" fill="#234B74">General-purpose agent harness</text>
  <text x="100" y="205" font-family="sans-serif" font-size="12.5" fill="#647F9B">Designed for broad, configurable work</text>

  <rect x="518" y="160" width="444" height="58" rx="18" fill="#E8F6F3"/>
  <path d="M518 200 H962 V218 H518Z" fill="#E8F6F3"/>
  <circle cx="553" cy="189" r="15" fill="#FFFFFF" stroke="#9FD8D0" stroke-width="1.2"/>
  <path d="M544 191 H562 L559 197 H547Z M553 187 V181 M548 187 H558 L557 191 H549Z" fill="none" stroke="#0F8C7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="580" y="186" font-family="sans-serif" font-size="18" font-weight="600" fill="#0F5C53">AanyaX maritime harness</text>
  <text x="580" y="205" font-family="sans-serif" font-size="12.5" fill="#527E78">Maritime operating environment built into BOSS</text>

  <g font-family="sans-serif">
    <rect x="58" y="236" width="404" height="54" rx="10" fill="#F8FAFD" stroke="#E0E8F1"/>
    <text x="76" y="257" font-size="11" font-weight="600" letter-spacing="1" fill="#7890A8">CONTEXT</text>
    <text x="76" y="277" font-size="14" font-weight="500" fill="#294E73">Assembled for each task</text>

    <rect x="58" y="304" width="404" height="54" rx="10" fill="#F8FAFD" stroke="#E0E8F1"/>
    <text x="76" y="325" font-size="11" font-weight="600" letter-spacing="1" fill="#7890A8">TOOLS</text>
    <text x="76" y="345" font-size="14" font-weight="500" fill="#294E73">Broad, extensible integrations</text>

    <rect x="58" y="372" width="404" height="54" rx="10" fill="#F8FAFD" stroke="#E0E8F1"/>
    <text x="76" y="393" font-size="11" font-weight="600" letter-spacing="1" fill="#7890A8">EXECUTION</text>
    <text x="76" y="413" font-size="14" font-weight="500" fill="#294E73">Interactive or configured automation</text>

    <rect x="58" y="440" width="404" height="54" rx="10" fill="#F8FAFD" stroke="#E0E8F1"/>
    <text x="76" y="461" font-size="11" font-weight="600" letter-spacing="1" fill="#7890A8">DOMAIN LAYER</text>
    <text x="76" y="481" font-size="14" font-weight="500" fill="#294E73">Added and maintained per deployment</text>

    <rect x="58" y="508" width="404" height="54" rx="10" fill="#F8FAFD" stroke="#E0E8F1"/>
    <text x="76" y="529" font-size="11" font-weight="600" letter-spacing="1" fill="#7890A8">OUTPUT</text>
    <text x="76" y="549" font-size="14" font-weight="500" fill="#294E73">Flexible, open-ended artifacts</text>

    <rect x="538" y="236" width="404" height="54" rx="10" fill="#F5FBFA" stroke="#D8EEEA"/>
    <text x="556" y="257" font-size="11" font-weight="600" letter-spacing="1" fill="#5C948C">CONTEXT</text>
    <text x="556" y="277" font-size="14" font-weight="500" fill="#145E56">User &#183; client &#183; vessel &#183; voyage &#183; history</text>

    <rect x="538" y="304" width="404" height="54" rx="10" fill="#F5FBFA" stroke="#D8EEEA"/>
    <text x="556" y="325" font-size="11" font-weight="600" letter-spacing="1" fill="#5C948C">TOOLS</text>
    <text x="556" y="345" font-size="14" font-weight="500" fill="#145E56">Approved BOSS data and capabilities</text>

    <rect x="538" y="372" width="404" height="54" rx="10" fill="#F5FBFA" stroke="#D8EEEA"/>
    <text x="556" y="393" font-size="11" font-weight="600" letter-spacing="1" fill="#5C948C">EXECUTION</text>
    <text x="556" y="413" font-size="14" font-weight="500" fill="#145E56">On demand &#183; scheduled &#183; fleet fan-out</text>

    <rect x="538" y="440" width="404" height="54" rx="10" fill="#F5FBFA" stroke="#D8EEEA"/>
    <text x="556" y="461" font-size="11" font-weight="600" letter-spacing="1" fill="#5C948C">DOMAIN LAYER</text>
    <text x="556" y="481" font-size="14" font-weight="500" fill="#145E56">Scope &#183; evidence &#183; run history built in</text>

    <rect x="538" y="508" width="404" height="54" rx="10" fill="#F5FBFA" stroke="#D8EEEA"/>
    <text x="556" y="529" font-size="11" font-weight="600" letter-spacing="1" fill="#5C948C">OUTPUT</text>
    <text x="556" y="549" font-size="14" font-weight="500" fill="#145E56">Brief &#183; dashboard &#183; alert &#183; decision support</text>
  </g>

  <text x="500" y="603" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#5B7189">AanyaX's advantage is not more model intelligence. It is less maritime infrastructure to assemble.</text>
</svg>
